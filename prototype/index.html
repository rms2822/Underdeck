<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Underdeck</title>
</head>
<body>
<!-- ART:START -->
<title>Underdeck</title>
<style>
  /* ============ Slate & Gold — hex dungeon aesthetic ============ */
  :root {
    --ground: #0e1216;
    --wall: #161c23;
    --wall-hi: #1e2630;
    --slate: #232b35;
    --slate-lo: #181f27;
    --parchment: #e9e1cf;
    --parchment-lo: #cfc4ab;
    --ink: #171310;
    --bone: #dfd8c8;
    --bone-dim: #97917f;
    --bone-faint: #655f52;
    --gold: #d9a441;
    --gold-hi: #f0c66a;
    --gold-deep: #8a6420;
    --blood: #c03434;
    --blood-deep: #7c1e1e;
    --verd: #7fa88f;
    --steel: #9baab8;
    --hex-mono: #b8c0cc;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(140% 90% at 50% 0%, rgba(217,164,65,.05), transparent 55%),
      var(--ground);
    color: var(--bone);
    font-family: var(--serif);
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  /* stone wall blocks */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, transparent 0 46px, rgba(0,0,0,.28) 46px 48px),
      repeating-linear-gradient(90deg, transparent 0 74px, rgba(0,0,0,.2) 74px 76px),
      repeating-linear-gradient(90deg, transparent 0 148px, rgba(255,255,255,.014) 148px 150px),
      linear-gradient(180deg, var(--wall-hi), var(--wall) 40%, var(--ground));
    opacity: .8;
    mask-image: linear-gradient(180deg, #000 0%, #000 70%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 70%, transparent 100%);
  }
  #motes { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  #pain {
    position: fixed; inset: 0; pointer-events: none; z-index: 7; opacity: 0;
    background: radial-gradient(120% 100% at 50% 50%, transparent 52%, rgba(192,52,52,.45));
  }
  #pain.on { animation: pain .45s ease; }
  @keyframes pain { 15% { opacity: 1; } 100% { opacity: 0; } }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button:disabled { cursor: default; }

  #app {
    position: relative; z-index: 1;
    max-width: 430px; margin: 0 auto; min-height: 100dvh;
    display: flex; flex-direction: column; gap: 4px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #app.shake { animation: shake .3s ease; }
  #app.shake-big { animation: shake .55s ease; }
  @keyframes shake {
    12% { transform: translate(-3px, 1px); } 25% { transform: translate(4px, -1px); }
    38% { transform: translate(-5px, 2px); } 50% { transform: translate(5px, -2px); }
    63% { transform: translate(-4px, 1px); } 75% { transform: translate(3px, 1px); }
    88% { transform: translate(-2px, 0); }
  }

  /* ============ shared hex bits ============ */
  .hexclip { clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  .logo {
    font-weight: 800; letter-spacing: .1em;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.8));
  }
  .caps { font-family: var(--serif); letter-spacing: .28em; text-transform: uppercase; font-size: 10.5px; color: var(--bone-dim); }
  .caps.faint { color: var(--bone-faint); }

  /* ============ top bar ============ */
  #topbar { display: flex; align-items: center; gap: 10px; min-height: 30px; }
  #topbar .logo { font-size: 17px; }
  #depth-label { flex: 1; text-align: center; }
  #mute { font-size: 14px; opacity: .65; }

  /* ============ deck emblem ============ */
  #deckrow { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px 0; margin-top: auto; }
  #hint-line { margin-bottom: auto; }
  #deck-hex {
    width: 66px; height: 74px; position: relative;
    display: grid; place-items: center;
    background: linear-gradient(160deg, var(--gold), var(--gold-deep));
  }
  #deck-hex .inner {
    position: absolute; inset: 3px; display: grid; place-items: center;
    background:
      repeating-linear-gradient(45deg, rgba(217,164,65,.07) 0 4px, transparent 4px 8px),
      linear-gradient(170deg, var(--slate), var(--slate-lo));
  }
  #deck-count { font-size: 24px; color: var(--gold-hi); font-weight: 600; font-variant-numeric: tabular-nums; }
  #peek-chip { font-family: var(--mono); font-size: 10px; color: var(--bone-faint); min-height: 13px; }
  #room-label { margin-top: 1px; }

  /* ============ room row ============ */
  #room { display: flex; justify-content: center; gap: 7px; min-height: 118px; align-items: flex-start; padding: 4px 0 0; }
  .cardhex { position: relative; width: 88px; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .cardhex .frame {
    width: 84px; height: 94px; position: relative;
    background: var(--hex-mono);
    transition: transform .12s ease;
  }
  .cardhex:active .frame { transform: scale(.94); }
  .cardhex .fill {
    position: absolute; inset: 2.5px; display: grid; place-items: center;
    background: radial-gradient(90% 90% at 50% 32%, var(--slate) 0%, var(--slate-lo) 85%);
  }
  .cardhex .art { font-size: 40px; line-height: 1; filter: saturate(.85) drop-shadow(0 4px 7px rgba(0,0,0,.6)); }
  .cardhex .hexname {
    font-size: 8.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--bone-dim); text-align: center; line-height: 1.25; min-height: 20px; max-width: 88px;
  }
  .badge {
    position: absolute; z-index: 2; width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center;
    font-family: var(--serif); font-size: 13px; font-weight: 700;
    background: #10151b; border: 1.5px solid var(--hex-mono); color: #fff;
  }
  .badge.val { top: -3px; left: 1px; }
  .badge.kind { top: -3px; right: 1px; font-size: 11px; }
  .cardhex.monster .frame { background: var(--hex-mono); }
  .cardhex.monster .badge.kind { background: #1a1114; }
  .cardhex.elite .frame { background: linear-gradient(160deg, var(--blood), var(--blood-deep)); }
  .cardhex.elite .badge { border-color: var(--blood); }
  .cardhex.boss .frame { width: 116px; height: 130px; background: linear-gradient(160deg, var(--gold), var(--blood-deep)); }
  .cardhex.boss { width: 120px; }
  .cardhex.boss .art { font-size: 58px; }
  .cardhex.potion .fill, .cardhex.treasure .fill, .cardhex.cache .fill {
    background: radial-gradient(95% 95% at 50% 30%, var(--parchment) 0%, var(--parchment-lo) 90%);
  }
  .cardhex.potion .frame { background: #f4efe2; }
  .cardhex.treasure .frame, .cardhex.cache .frame { background: linear-gradient(160deg, var(--gold-hi), var(--gold)); }
  .cardhex.curse .frame { background: linear-gradient(160deg, #6b4a8c, #2e1f42); }
  .cardhex.curse .fill { background: radial-gradient(90% 90% at 50% 32%, #241a33, #171021); }
  .cardhex.enter { animation: hexin .4s ease backwards; }
  @keyframes hexin { from { opacity: 0; transform: translateY(12px) scale(.9); } }
  .cardhex.hit .frame { animation: hexhit .32s ease; }
  @keyframes hexhit { 0% { filter: brightness(2.3); } 45% { transform: translateY(6px) scale(.94); filter: brightness(1.6); } }
  .cardhex.resolve { animation: hexout .22s ease forwards; }
  @keyframes hexout { to { opacity: 0; transform: scale(.85) translateY(-8px); } }
  .cardhex.fleeing { animation: hexflee .3s ease forwards; }
  @keyframes hexflee { to { opacity: 0; transform: translateY(70px) rotate(5deg); } }
  .cardhex.selected .frame { background: var(--gold-hi); box-shadow: 0 0 16px rgba(217,164,65,.5); }
  .hexslot {
    width: 84px; height: 94px; opacity: .5;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 94"><path d="M42 2 L80 24.5 V69.5 L42 92 L4 69.5 V24.5 Z" fill="none" stroke="%2397917f" stroke-width="1.6" stroke-dasharray="5 5"/></svg>');
    background-size: 100% 100%;
  }

  /* floating combat text */
  .float {
    position: absolute; left: 50%; top: 30%; transform: translateX(-50%);
    font-family: var(--serif); font-size: 36px; font-weight: 700;
    pointer-events: none; z-index: 5;
    animation: floatUp 1s ease-out forwards;
    text-shadow: 0 2px 12px rgba(0,0,0,.85);
  }
  .float.blood { color: var(--blood); }
  .float.verd  { color: var(--verd); }
  .float.steel { color: var(--steel); }
  .float.bone  { color: var(--bone-dim); }
  .float.gold  { color: var(--gold); }
  @keyframes floatUp { to { opacity: 0; transform: translateX(-50%) translateY(-48px); } }

  /* ============ hero row ============ */
  #herorow { display: flex; justify-content: center; align-items: center; gap: 14px; padding: 4px 0 0; position: relative; }
  .kit { position: relative; width: 78px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .kit .frame { width: 72px; height: 80px; position: relative; background: #f4efe2; }
  .kit .fill { position: absolute; inset: 2.5px; display: grid; place-items: center;
    background: radial-gradient(95% 95% at 50% 30%, var(--parchment), var(--parchment-lo)); }
  .kit .art { font-size: 32px; filter: saturate(.85) drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
  .kit.empty .frame { background: none; }
  .kit.empty .fill { background: none; }
  .kit .frame.slot {
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 80"><path d="M36 2 L68 21 V59 L36 78 L4 59 V21 Z" fill="none" stroke="%2397917f" stroke-width="1.5" stroke-dasharray="5 5"/></svg>');
    background-size: 100% 100%; opacity: .55;
  }
  #hero { width: 96px; }
  #hero .frame { width: 90px; height: 100px; background: linear-gradient(160deg, var(--gold-hi), var(--gold-deep)); }
  #hero .fill { background: radial-gradient(90% 90% at 50% 30%, #2b3440, var(--slate-lo)); }
  #hero .art { font-size: 46px; filter: grayscale(1) brightness(1.9) sepia(.25) drop-shadow(0 4px 7px rgba(0,0,0,.7)); }
  #hero.pulse .frame { animation: heropulse .55s ease; }
  @keyframes heropulse { 30% { box-shadow: 0 0 0 5px rgba(127,168,143,.55); } }
  .kitline { font-family: var(--mono); font-size: 10.5px; color: var(--bone-dim); font-variant-numeric: tabular-nums; text-align: center; }
  .kitline .limit { color: var(--blood); }
  .kitline .heart { color: var(--blood); }
  .badge.small { width: 21px; height: 21px; font-size: 11px; }

  #statline { display: flex; justify-content: center; align-items: center; gap: 16px; font-family: var(--mono); font-size: 12px; padding: 2px 0; }
  #focus-pips { letter-spacing: .12em; color: var(--gold); font-size: 13px; }
  #focus-pips .off { color: var(--bone-faint); }
  #gold-line { color: var(--gold); }
  #bloodpact-btn { font-family: var(--mono); font-size: 10px; color: var(--blood); border: 1px solid rgba(192,52,52,.5); border-radius: 6px; padding: 2px 7px; }

  /* ============ skill hand ============ */
  #handrow { display: flex; gap: 8px; align-items: stretch; padding: 4px 0 0; }
  .skill {
    flex: 1; min-width: 0; border-radius: 9px; padding: 7px 6px 6px;
    background: linear-gradient(170deg, var(--slate), var(--slate-lo));
    border: 1px solid rgba(223,216,200,.16);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    box-shadow: 0 5px 12px rgba(0,0,0,.4);
  }
  .skill:not(:disabled):active { transform: scale(.96); }
  .skill .s-art { font-size: 21px; filter: saturate(.85) drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  .skill .s-name { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--bone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .skill .s-cost { font-family: var(--mono); font-size: 9px; color: var(--gold); }
  .skill:disabled { opacity: .38; }
  .skill.locked { border-color: rgba(192,52,52,.5); }
  #flee-btn {
    flex: 0 0 74px; border-radius: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: linear-gradient(180deg, var(--blood), var(--blood-deep));
    color: #fff; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700;
    box-shadow: 0 5px 12px rgba(0,0,0,.45);
  }
  #flee-btn .f-art { font-size: 18px; }
  #flee-btn:disabled { opacity: .35; filter: grayscale(.6); }
  #hint-line { text-align: center; font-size: 11.5px; font-style: italic; color: var(--bone-faint); min-height: 1.3em; padding-top: 3px; }

  /* ============ sheet ============ */
  #backdrop { position: fixed; inset: 0; background: rgba(5,7,9,.65); z-index: 8; opacity: 0; pointer-events: none; transition: opacity .2s; }
  #backdrop.open { opacity: 1; pointer-events: auto; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
    max-width: 430px; margin: 0 auto; max-height: 80dvh; overflow-y: auto;
    background: linear-gradient(180deg, var(--wall-hi), var(--wall));
    border-radius: 14px 14px 0 0; border: 1px solid rgba(217,164,65,.25); border-bottom: 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .24s ease;
    display: flex; flex-direction: column; gap: 8px;
  }
  #sheet.open { transform: translateY(0); }
  #sheet h3 { font-size: 18px; font-weight: 600; text-wrap: balance; }
  #sheet h3 .h-art { font-size: 22px; margin-right: 6px; filter: saturate(.85); }
  #sheet h3 .dim { color: var(--bone-dim); font-size: 13px; font-style: italic; }
  #sheet .note { font-size: 12px; font-style: italic; color: var(--bone-dim); line-height: 1.4; }
  .act {
    text-align: left; padding: 11px 13px; border-radius: 8px;
    background: rgba(0,0,0,.3); border: 1px solid rgba(223,216,200,.15);
    display: flex; flex-direction: column; gap: 3px;
  }
  .act:not(:disabled):active { background: rgba(0,0,0,.55); }
  .act:disabled { opacity: .45; }
  .act .t { font-size: 14.5px; }
  .act .sub { font-family: var(--mono); font-size: 10.5px; color: var(--bone-dim); }
  .act.lethal { border-color: rgba(192,52,52,.6); }
  .act.lethal .sub { color: var(--blood); }
  .act.goldact { border-color: rgba(217,164,65,.45); }
  .act.goldact .t { color: var(--gold); }
  .act.cancel { border-color: transparent; background: none; align-items: center; }
  .act.cancel .t { color: var(--bone-faint); font-style: italic; font-size: 13px; }
  .shoprow { display: flex; align-items: center; gap: 10px; }
  .shoprow .s-icon { font-size: 22px; filter: saturate(.85); }
  .shoprow .s-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .shoprow .price { font-family: var(--mono); font-size: 12px; color: var(--gold); white-space: nowrap; }

  /* ============ overlays ============ */
  .overlay {
    position: fixed; inset: 0; z-index: 12; overflow-y: auto;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(217,164,65,.08), transparent 55%),
      var(--ground);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 40px 26px; text-align: center;
  }
  .overlay.open { display: flex; }
  .overlay .logo.big { font-size: clamp(40px, 12vw, 54px); letter-spacing: .08em; }
  .flourish { width: 46px; height: 2px; background: var(--gold); border-radius: 1px; }
  .digest { max-width: 36ch; display: flex; flex-direction: column; gap: 9px; text-align: left; }
  .digest p { font-size: 13.5px; line-height: 1.5; color: var(--bone-dim); }
  .digest b { color: var(--bone); font-weight: 600; }
  .digest .g { color: var(--gold); } .digest .r { color: var(--blood); } .digest .v { color: var(--verd); }
  .btn-col { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; margin-top: 4px; }
  .cta {
    padding: 14px; border-radius: 8px; letter-spacing: .18em; text-transform: uppercase; font-size: 13px;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold-deep)); color: #221604; font-weight: 800;
  }
  .cta.ghost { background: none; border: 1px solid rgba(223,216,200,.28); color: var(--bone); font-weight: 400; }
  .verdict { font-size: clamp(38px, 11vw, 52px); letter-spacing: .1em; font-weight: 700; }
  .verdict.good { color: var(--gold); }
  .verdict.bad { color: var(--blood); }
  .bigart { font-size: 54px; filter: saturate(.85) drop-shadow(0 6px 12px rgba(0,0,0,.7)); }
  .epitaph { font-style: italic; color: var(--bone-dim); max-width: 32ch; text-wrap: balance; line-height: 1.5; }
  .scoretable { font-family: var(--mono); font-size: 12.5px; color: var(--bone-dim); display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums; }
  .scoretable .total { color: var(--gold); font-size: 16px; margin-top: 4px; }
  .best-line { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--bone-faint); text-transform: uppercase; }
  .menagerie { font-size: 24px; letter-spacing: .3em; filter: saturate(.85) drop-shadow(0 4px 8px rgba(0,0,0,.6)); }

  /* ============ tutorial ============ */
  #tutorial { justify-content: flex-start; gap: 12px; padding-top: max(46px, env(safe-area-inset-top)); }
  #tut-skip {
    position: absolute; top: 14px; right: 16px; z-index: 2;
    width: 34px; height: 34px; border-radius: 50%; font-size: 15px;
    color: var(--bone-dim); background: rgba(255,255,255,.06); border: 1px solid rgba(223,216,200,.16);
  }
  .tut-title { font-family: var(--serif); font-size: clamp(24px, 6.5vw, 30px); font-weight: 600; color: var(--bone); text-wrap: balance; letter-spacing: .01em; }
  .tut-stage {
    width: 100%; max-width: 360px; min-height: 190px;
    display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 0;
  }
  .tut-stage .cardhex { animation: hexin .4s ease backwards; position: relative; }
  .tut-stage .arrow { font-size: 22px; color: var(--gold); align-self: center; }
  .tut-stage .tag {
    position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--gold); white-space: nowrap;
  }
  .tut-carry { outline: 2px dashed var(--gold); outline-offset: 3px; border-radius: 4px; }
  .tut-mini-skill {
    width: 78px; border-radius: 9px; padding: 8px 6px;
    background: linear-gradient(170deg, var(--slate), var(--slate-lo));
    border: 1px solid rgba(223,216,200,.16);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .tut-mini-skill .s-art { font-size: 22px; }
  .tut-mini-skill .s-name { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--bone); }
  .tut-mini-skill .s-cost { font-family: var(--mono); font-size: 9px; color: var(--gold); }
  .tut-emblem {
    width: 92px; height: 102px; display: grid; place-items: center;
    background: linear-gradient(160deg, var(--gold), var(--gold-deep));
  }
  .tut-emblem .inner {
    position: absolute; inset: 4px; display: grid; place-items: center;
    background: repeating-linear-gradient(45deg, rgba(217,164,65,.07) 0 4px, transparent 4px 8px), linear-gradient(170deg, var(--slate), var(--slate-lo));
  }
  .tut-emblem span { font-size: 30px; color: var(--gold-hi); font-weight: 600; }
  .tut-relic-chip {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: rgba(0,0,0,.28); border: 1px solid rgba(217,164,65,.35); border-radius: 10px;
    padding: 9px 13px; max-width: 300px;
  }
  .tut-relic-chip .r-art { font-size: 24px; }
  .tut-relic-chip .r-name { color: var(--gold); font-size: 13px; }
  .tut-relic-chip .r-text { font-size: 11px; color: var(--bone-dim); font-style: italic; }
  .tut-body { max-width: 34ch; font-size: 14.5px; line-height: 1.55; color: var(--bone-dim); text-wrap: pretty; }
  .tut-body b { color: var(--bone); font-weight: 600; }
  .tut-body .r { color: var(--blood); } .tut-body .g { color: var(--gold); } .tut-body .v { color: var(--verd); } .tut-body .s { color: var(--steel); }
  .tut-dots { display: flex; gap: 7px; margin-top: 2px; }
  .tut-dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(223,216,200,.22); transition: background .2s, transform .2s; }
  .tut-dots i.on { background: var(--gold); transform: scale(1.25); }
  .tut-nav { display: flex; gap: 10px; width: 100%; max-width: 300px; margin-top: 2px; }
  .tut-nav .cta { flex: 1; padding: 13px; }
  .tut-nav .cta.ghost.hidden { visibility: hidden; }

  @media (prefers-reduced-motion: reduce) {

<script>
"use strict";
/* ================================================================
   UNDERDECK — vertical slice per UNDERDECK_GDD.md
   Scoundrel room loop + skill deck + relics + depths/bosses/shops.
   ================================================================ */

/* ---------- deterministic RNG ---------- */
const MASK = (1n << 64n) - 1n;
function splitmix64(seed) {
  let s = BigInt(seed) & MASK;
  return function () {
    s = (s + 0x9E3779B97F4A7C15n) & MASK;
    let z = s;
    z = ((z ^ (z >> 30n)) * 0xBF58476D1CE4E5B9n) & MASK;
    z = ((z ^ (z >> 27n)) * 0x94D049BB133111EBn) & MASK;
    return (z ^ (z >> 31n)) & MASK;
  };
}
function shuffleWith(a, next) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Number(next() % BigInt(i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}
const rngInt = (next, n) => Number(next() % BigInt(n));

/* ---------- content: monsters, weapons, relics, skills ---------- */
const MONSTER = {
  2: ["Rat", "🐀"], 3: ["Cave Bat", "🦇"], 4: ["Slime", "👾"], 5: ["Goblin", "👺"],
  6: ["Skeleton", "💀"], 7: ["Bandit", "🥷"], 8: ["Dire Wolf", "🐺"], 9: ["Cultist", "🧙"],
  10: ["Ogre", "👹"], 11: ["Wraith", "👻"], 12: ["Dark Knight", "🤺"], 13: ["Stone Golem", "🗿"],
  14: ["Dragon", "🐉"],
};
const ELITES = {
  armored: { name: "Armored", text: "your weapon counts as 2 less" },
  brutal:  { name: "Brutal",  text: "deals 2 extra damage" },
};
const CURSES = {
  blight: { name: "Blight",        art: "🕷️", text: "Take 3 damage." },
  thief:  { name: "Thief's Curse", art: "🐍", text: "Lose 5 gold." },
  rust:   { name: "Rustwind",      art: "🌫️", text: "Your blade dulls to its own power." },
};
const WEAPONS = {
  dagger:  { name: "Rusty Dagger",     power: 4, art: "🔪", text: "A delver's first friend.", price: 0 },
  rapier:  { name: "Duelist's Rapier", power: 5, art: "🗡️", text: "Doesn't dull when you take no damage.", price: 8 },
  kris:    { name: "Kris of Thirst",   power: 4, art: "⚔️", text: "Heal 1 whenever it slays.", price: 10 },
  whisper: { name: "Whisper Blade",    power: 6, art: "🌬️", text: "Ignores dulling against threat 4 or less.", price: 12 },
  hammer:  { name: "Warhammer",        power: 9, art: "🔨", text: "Dulls two steps at a time.", price: 14 },
};
const RELICS = {
  whetstone:   { name: "Whetstone",       art: "🪨", text: "Your blade never dulls below 4.", price: 10 },
  emberheart:  { name: "Ember Heart",     art: "❤️‍🔥", text: "Potions also slay the strongest monster they can.", price: 12 },
  boots:       { name: "Coward's Boots",  art: "👢", text: "You may flee twice in a row.", price: 9 },
  glasssigil:  { name: "Glass Sigil",     art: "💎", text: "Gold gains doubled. Max health becomes 12.", price: 8 },
  gravebind:   { name: "Gravebind",       art: "⛓️", text: "Every 5th slain monster returns as a Revenant skill.", price: 11 },
  torchbearer: { name: "Torchbearer",     art: "🕯️", text: "The top card of the dungeon is always revealed.", price: 9 },
  bloodpact:   { name: "Bloodpact",       art: "🩸", text: "Trade 2 health for 1 focus.", price: 10 },
  phoenix:     { name: "Phoenix Feather", art: "🪶", text: "Once per run, survive death at 1 health.", price: 13 },
};
const SKILLS = {
  strike:     { name: "Strike",        cost: 0, art: "⚔️", text: "+3 power on your next fight this room." },
  guard:      { name: "Guard",         cost: 1, art: "🛡️", text: "Block the next 4 damage this room." },
  scout:      { name: "Scout",         cost: 1, art: "👁️", text: "Peek the top 2 dungeon cards; you may swap them." },
  slip:       { name: "Slip",          cost: 0, art: "💨", text: "This room you may flee, even after fleeing." },
  bash:       { name: "Bash",          cost: 1, art: "💥", text: "Slay a monster of threat 6 or less." },
  mend:       { name: "Mend",          cost: 1, art: "🌿", text: "Heal 3." },
  pickpocket: { name: "Pickpocket",    cost: 0, art: "💰", text: "Gain 4 gold." },
  preserve:   { name: "Preserve",      cost: 1, art: "🧿", text: "Your next weapon kill doesn't dull the blade." },
  sharpen:    { name: "Sharpen",       cost: 1, art: "⚒️", text: "Restore your weapon to a keen edge — undo all dulling." },
  snipe:      { name: "Snipe",         cost: 1, art: "🏹", text: "Resolve one card; banish the rest of the room to the bottom." },
  knifethrow: { name: "Knife Throw",   cost: 1, art: "🔪", text: "Fight a monster ignoring dullness; the weapon is lost." },
  grit:       { name: "Grit",          cost: 1, art: "🐲", text: "+5 defense on your next fight this room." },
  chalice:    { name: "Second Chalice",cost: 1, art: "✨", text: "You may drink a second potion this room." },
  smokebomb:  { name: "Smoke Bomb",    cost: 2, art: "💣", text: "Swap two room cards with the top two of the dungeon." },
  necromancy: { name: "Necromancy",    cost: 2, art: "🔮", text: "Unearth 6 discarded cards; claim one red." },
  revenant:   { name: "Revenant",      cost: 1, art: "🦴", text: "Slay a monster of threat 8 or less." },
};
const STARTER_DECK = ["strike", "strike", "strike", "strike", "guard", "guard", "guard", "scout", "sharpen", "slip"];
const DRAFT_POOL = ["bash", "mend", "pickpocket", "preserve", "sharpen", "snipe", "knifethrow", "grit", "chalice", "smokebomb", "necromancy", "strike", "guard"];
const DEPTHS = [
  { name: "The Cellars",       numeral: "I" },
  { name: "The Flooded Vaults",numeral: "II" },
  { name: "The Throat",        numeral: "III" },
];
const BOSSES = [
  { name: "The Gaoler",     threat: 12, art: "⛓️", special: "lock",
    text: "He locks one of your skills away for the fight." },
  { name: "The Rot King",   threat: 13, art: "🧟", special: "twice",
    text: "He must be struck down twice." },
  { name: "The Deep Tyrant",threat: 15, art: "🐙", special: "pierce",
    text: "He ignores 3 of your weapon's power." },
];

function buildDepthDeck(depth, seed) {
  const next = splitmix64(seed);
  const cards = [];
  const mon = (r) => { cards.push({ kind: "monster", s: "♠", r }); cards.push({ kind: "monster", s: "♣", r }); };
  if (depth === 1) {
    for (let r = 2; r <= 8; r++) mon(r);                       // 14 monsters
    for (let r = 2; r <= 6; r++) cards.push({ kind: "treasure", s: "♦", r });
    cards.push({ kind: "cache", s: "♦", r: 11 });
    for (let r = 2; r <= 6; r++) cards.push({ kind: "potion", s: "♥", r });
  } else if (depth === 2) {
    for (let r = 5; r <= 11; r++) mon(r);                      // 14 monsters
    ["blight", "thief", "rust"].forEach((id) => cards.push({ kind: "curse", curse: id, r: 0 }));
    for (let r = 4; r <= 8; r++) cards.push({ kind: "treasure", s: "♦", r });
    cards.push({ kind: "cache", s: "♦", r: 12 });
    for (let r = 4; r <= 8; r++) cards.push({ kind: "potion", s: "♥", r });
  } else {
    for (let r = 9; r <= 14; r++) mon(r);                      // 12 monsters
    ["blight", "rust"].forEach((id) => cards.push({ kind: "curse", curse: id, r: 0 }));
    for (let r = 6; r <= 10; r++) cards.push({ kind: "treasure", s: "♦", r });
    cards.push({ kind: "cache", s: "♦", r: 13 });
    for (let r = 7; r <= 10; r++) cards.push({ kind: "potion", s: "♥", r });
    // three elites among the monsters
    const monsters = cards.filter((c) => c.kind === "monster");
    for (let i = 0; i < 3; i++) {
      let m;
      do { m = monsters[rngInt(next, monsters.length)]; } while (m.elite);
      m.elite = rngInt(next, 2) === 0 ? "armored" : "brutal";
    }
  }
  shuffleWith(cards, next);
  return cards;
}

const cardName = (c) =>
  c.kind === "monster" ? (c.elite ? ELITES[c.elite].name + " " : "") + MONSTER[c.r][0]
  : c.kind === "potion" ? (c.r <= 4 ? "Weak Potion" : c.r <= 7 ? "Potion" : "Greater Potion")
  : c.kind === "treasure" ? "Treasure"
  : c.kind === "cache" ? "Loot Cache"
  : CURSES[c.curse].name;
const cardArt = (c) =>
  c.kind === "monster" ? MONSTER[c.r][1]
  : c.kind === "potion" ? (c.r <= 4 ? "🧪" : c.r <= 7 ? "⚗️" : "🏺")
  : c.kind === "treasure" ? "🪙"
  : c.kind === "cache" ? "🎁"
  : CURSES[c.curse].art;
const kindBadge = { monster: "☠", potion: "♥", treasure: "◆", cache: "◆", curse: "✦" };
const cid = (c) => (c.kind === "curse" ? "curse-" + c.curse : c.kind + "-" + c.s + c.r + (c.elite || ""));

/* ================================================================
   SOUND — synthesized, no assets
   ================================================================ */
const SFX = (() => {
  let ctx = null, muted = false;
  try { muted = localStorage.getItem("underdeck.muted") === "1"; } catch (e) {}
  function ac() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, vol, slide) {
    if (muted) return;
    try {
      const c = ac(), o = c.createOscillator(), g = c.createGain();
      o.type = type || "triangle";
      o.frequency.setValueAtTime(freq, c.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), c.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.12, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      o.connect(g).connect(c.destination);
      o.start(); o.stop(c.currentTime + dur);
    } catch (e) {}
  }
  function noise(dur, vol, cutoff) {
    if (muted) return;
    try {
      const c = ac(), src = c.createBufferSource();
      const buf = c.createBuffer(1, c.sampleRate * dur, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      src.buffer = buf;
      const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff;
      const g = c.createGain();
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      src.connect(f).connect(g).connect(c.destination);
      src.start();
    } catch (e) {}
  }
  return {
    tap: () => tone(220, 0.06, "sine", 0.05),
    slash: () => { noise(0.12, 0.16, 3200); tone(660, 0.09, "square", 0.04, -300); },
    thud: () => { noise(0.16, 0.24, 320); tone(90, 0.13, "sine", 0.2, -40); },
    heal: () => { tone(523, 0.12, "sine", 0.1); setTimeout(() => tone(784, 0.16, "sine", 0.1), 90); },
    equip: () => { tone(392, 0.07, "triangle", 0.12); setTimeout(() => tone(587, 0.09, "triangle", 0.12), 60); },
    whoosh: () => noise(0.26, 0.12, 900),
    coin: () => { tone(988, 0.07, "square", 0.05); setTimeout(() => tone(1319, 0.13, "square", 0.05), 70); },
    magic: () => { tone(440, 0.1, "sine", 0.08); setTimeout(() => tone(659, 0.1, "sine", 0.08), 80); setTimeout(() => tone(880, 0.18, "sine", 0.08), 160); },
    curse: () => { tone(310, 0.25, "sawtooth", 0.07, -120); },
    boss: () => { tone(110, 0.5, "sawtooth", 0.13, -30); noise(0.4, 0.1, 250); },
    death: () => { tone(170, 0.7, "sawtooth", 0.12, -110); noise(0.5, 0.14, 400); },
    toggle: () => { muted = !muted; try { localStorage.setItem("underdeck.muted", muted ? "1" : "0"); } catch (e) {} return muted; },
    muted: () => muted,
  };
})();

/* ================================================================
   RUN STATE
   ================================================================ */
let S = null;
let mode = null; // null | {type:'bash'|'revenant'|'knife'|'snipe'} | {type:'smoke', drawn, picks}
const $ = (q) => document.querySelector(q);
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

function newRun(seed) {
  const base = String(seed);
  S = {
    seed: base,
    rng: splitmix64(BigInt(base) ^ 0xC0FFEEn),
    depth: 1, phase: "room", roomNo: 0,
    hp: 20, maxHp: 20, gold: 0,
    weapon: Object.assign({ id: "dagger" }, WEAPONS.dagger), weaponLimit: null, weaponBonus: 0,
    relics: [], phoenixUsed: false,
    deck: buildDepthDeck(1, BigInt(base)),
    room: [], discard: [],
    skills: { draw: STARTER_DECK.slice(), disc: [], hand: [] },
    focus: 2, potionDrunk: false, secondPotion: false, fledLast: false, actedThisRoom: 0,
    strikeNext: 0, gritNext: 0, block: 0, preserveNext: false,
    slain: 0, graveTick: 0, bossesSlain: 0, removals: 0,
    boss: null,
  };
  shuffleWith(S.skills.draw, S.rng);
  mode = null;
  dealRoom(false);
}
function hasRelic(id) { return S.relics.includes(id); }
function goldGain(n) { S.gold += hasRelic("glasssigil") ? n * 2 : n; }

function drawHand() {
  S.skills.disc.push(...S.skills.hand);
  S.skills.hand = [];
  for (let i = 0; i < 3; i++) {
    if (S.skills.draw.length === 0) {
      S.skills.draw = S.skills.disc; S.skills.disc = [];
      shuffleWith(S.skills.draw, S.rng);
    }
    if (S.skills.draw.length) S.skills.hand.push(S.skills.draw.shift());
  }
  S.focus = 2;
  S.lockedIdx = -1;
}
function dealRoom(fled) {
  while (S.room.length < 4 && S.deck.length > 0) S.room.push(S.deck.shift());
  S.fledLast = fled;
  S.slipActive = false;
  S.snipePending = false;
  S.actedThisRoom = 0;
  S.potionDrunk = false; S.secondPotion = false;
  S.strikeNext = 0; S.gritNext = 0; S.block = 0; S.preserveNext = false;
  S.roomNo++;
  drawHand();
}
function canFleeNow() {
  return S.phase === "room" && S.room.length > 0 && S.actedThisRoom === 0 &&
    (!S.fledLast || hasRelic("boots") || S.slipActive);
}

/* ---------- combat ---------- */
function effLimit() {
  if (S.weaponLimit === null) return Infinity;
  return hasRelic("whetstone") ? Math.max(S.weaponLimit, 5) : S.weaponLimit;
}
function effPower() { return S.weapon ? S.weapon.power + (S.weaponBonus || 0) : 0; }
function canUseWeapon(c) {
  if (!S.weapon || c.kind !== "monster") return false;
  if (S.weapon.id === "whisper" && c.r <= 4) return true;
  return c.r <= effLimit(); // equal-or-lower: you can finish off a matching rank
}
function threatOf(c) { return c.r + (c.elite === "brutal" ? 2 : 0); }
function previewFight(c, useWeapon, opts) {
  opts = opts || {};
  let power = 0;
  if (useWeapon && S.weapon) {
    power = effPower();
    if (c.elite === "armored") power -= 2;
    if (S.phase === "boss" && S.boss.special === "pierce") power -= 3;
  }
  power += S.strikeNext;
  let dmg = Math.max(0, threatOf(c) - Math.max(0, power) - S.gritNext);
  const blocked = Math.min(S.block, dmg);
  return { dmg: dmg - blocked, blocked };
}
function loseHp(n) {
  S.hp = Math.max(0, S.hp - n);
  if (S.hp === 0 && hasRelic("phoenix") && !S.phoenixUsed) {
    S.phoenixUsed = true;
    S.hp = 1;
    return "phoenix";
  }
  return S.hp === 0 ? "dead" : "ok";
}
function onSlain(c, weaponUsed) {
  S.slain++;
  goldGain(1);
  if (weaponUsed && S.weapon && S.weapon.id === "kris") S.hp = Math.min(S.maxHp, S.hp + 1);
  if (hasRelic("gravebind")) {
    S.graveTick++;
    if (S.graveTick >= 5) { S.graveTick = 0; S.skills.disc.push("revenant"); }
  }
}
function applyDull(c, opts) {
  opts = opts || {};
  if (!S.weapon || opts.noDull) return;
  if (S.weapon.id === "whisper" && c.r <= 4) return;
  if (S.weapon.id === "rapier" && opts.tookNoDamage) return;
  if (S.preserveNext) { S.preserveNext = false; return; }
  let dullTo = S.weapon.id === "hammer" ? c.r - 2 : c.r;
  S.weaponLimit = S.weaponLimit === null ? dullTo : Math.min(S.weaponLimit, dullTo);
}
function fightMonster(c, useWeapon, opts) {
  opts = opts || {};
  const pv = previewFight(c, useWeapon);
  S.block -= pv.blocked;
  S.strikeNext = 0; S.gritNext = 0;
  const outcome = loseHp(pv.dmg);
  if (useWeapon) applyDull(c, { noDull: opts.noDull, tookNoDamage: pv.dmg === 0 });
  if (opts.loseWeapon) { S.weapon = null; S.weaponLimit = null; }
  onSlain(c, useWeapon);
  return { dmg: pv.dmg, outcome };
}

/* ---------- room card resolution ---------- */
function removeFromRoom(c) {
  const i = S.room.findIndex((x) => cid(x) === cid(c));
  if (i < 0) throw new Error("not in room");
  S.room.splice(i, 1);
  S.discard.push(c);
  S.actedThisRoom++;
}
function afterResolve() {
  if (S.hp === 0) return endRun(false);
  if (S.room.length === 1 && S.deck.length > 0) { dealRoom(false); return; }
  if (S.room.length === 0 && S.deck.length === 0) startBoss();
}

/* ---------- boss ---------- */
function startBoss() {
  S.phase = "bossintro";
  const b = BOSSES[S.depth - 1];
  S.boss = { name: b.name, threat: b.threat, art: b.art, special: b.special, text: b.text, hitsLeft: b.special === "twice" ? 2 : 1 };
  SFX.boss();
  showInterstitial({
    eyebrow: "the depth stirs", art: b.art, title: b.name.toUpperCase(),
    text: b.text + " Threat " + b.threat + ".",
    btn: "Face Him",
    onGo: () => {
      S.phase = "boss";
      drawHand();
      if (S.boss.special === "lock" && S.skills.hand.length) S.lockedIdx = rngInt(S.rng, S.skills.hand.length);
      S.strikeNext = 0; S.gritNext = 0; S.block = 0;
      render();
    },
  });
}
function fightBoss(useWeapon) {
  const c = { kind: "monster", s: "♠", r: S.boss.threat };
  const pv = previewFight(c, useWeapon);
  S.block -= pv.blocked;
  S.strikeNext = 0; S.gritNext = 0;
  const outcome = loseHp(pv.dmg);
  if (useWeapon) applyDull(c, { tookNoDamage: pv.dmg === 0 });
  if (outcome === "dead") return { dmg: pv.dmg, outcome };
  S.boss.hitsLeft--;
  if (S.boss.hitsLeft <= 0) {
    S.bossesSlain++;
    goldGain(8);
    S.slain++;
    return { dmg: pv.dmg, outcome: "slain" };
  }
  return { dmg: pv.dmg, outcome: "again" };
}
function bossDefeated() {
  if (S.depth >= 3) return endRun(true);
  showRelicDraft(() => showShop(() => {
    S.depth++;
    S.weaponBonus++; // your blade grows keener as you descend (+1 power per depth)
    S.deck = buildDepthDeck(S.depth, BigInt(S.seed) + BigInt(S.depth * 7919));
    S.phase = "room"; S.boss = null; S.room = [];
    dealRoom(false);
    render();
  }));
}

/* ---------- scoring / end ---------- */
function scoreParts() {
  return {
    hp: S.hp * 10, gold: S.gold, depth: S.depth * 100, boss: S.bossesSlain * 50,
    total: S.hp * 10 + S.gold + S.depth * 100 + S.bossesSlain * 50,
  };
}
function bestsGet() {
  try { return { score: Number(localStorage.getItem("underdeck.best")) || null, depth: Number(localStorage.getItem("underdeck.bestDepth")) || null }; }
  catch (e) { return { score: null, depth: null }; }
}
function endRun(won) {
  if (S.phase === "over") return;
  S.phase = "over";
  const sc = scoreParts();
  let isBest = false;
  try {
    const b = bestsGet();
    if (b.score === null || sc.total > b.score) { localStorage.setItem("underdeck.best", String(sc.total)); isBest = true; }
    if (b.depth === null || S.depth > b.depth) localStorage.setItem("underdeck.bestDepth", String(S.depth));
  } catch (e) {}
  $("#end-eyebrow").textContent = won ? "the deep tyrant falls" : "the dungeon shuffles you under";
  $("#end-art").textContent = won ? "🏆" : "☠️";
  const v = $("#end-verdict");
  v.textContent = won ? "ESCAPED" : "SLAIN";
  v.className = "verdict " + (won ? "good" : "bad");
  $("#end-epitaph").textContent = won
    ? "Three depths conquered. The Underdeck spits you back into daylight."
    : "Depth " + DEPTHS[S.depth - 1].numeral + " — " + DEPTHS[S.depth - 1].name + " keeps your bones.";
  $("#end-score").innerHTML =
    "<span>health ×10 &nbsp;·&nbsp; " + sc.hp + "</span>" +
    "<span>gold &nbsp;·&nbsp; " + sc.gold + "</span>" +
    "<span>depth ×100 &nbsp;·&nbsp; " + sc.depth + "</span>" +
    "<span>bosses ×50 &nbsp;·&nbsp; " + sc.boss + "</span>" +
    '<span class="total">score ' + sc.total + "</span>";
  const b = bestsGet();
  $("#end-best").textContent = isBest ? "new best score" : b.score !== null ? "best " + b.score : "";
  if (!won) SFX.death(); else SFX.coin();
  setTimeout(() => { closeSheet(); $("#end").classList.add("open"); }, 650);
}

/* ================================================================

function hexCardHTML(c) {
  const kb = kindBadge[c.kind];
  const valBadge = c.kind === "curse" ? "" : '<span class="badge val">' + (c.kind === "cache" ? "?" : c.r) + "</span>";
  return (
    '<span class="frame hexclip"><span class="fill hexclip"><span class="art" aria-hidden="true">' + cardArt(c) + "</span></span></span>" +
    valBadge +
    '<span class="badge kind">' + kb + "</span>" +
    '<span class="hexname">' + cardName(c) + "</span>"

}
function render() {
  if (!S) return;

  $("#room-label").textContent = S.phase === "boss" ? S.boss.name.toUpperCase() : "ROOM " + S.roomNo;
  $("#peek-chip").textContent =
    hasRelic("torchbearer") && S.deck.length && S.phase === "room"
      ? "next: " + cardArt(S.deck[0]) + " " + (S.deck[0].kind === "curse" ? cardName(S.deck[0]) : S.deck[0].r)
      : "";

  // room / boss
  const room = $("#room");
  room.innerHTML = "";
  if (S.phase === "boss") {
    const b = document.createElement("button");

    b.dataset.cid = "boss";
    b.innerHTML =
      '<span class="frame hexclip"><span class="fill hexclip"><span class="art" aria-hidden="true">' + S.boss.art + "</span></span></span>" +
      '<span class="badge val">' + S.boss.threat + "</span>" +
      '<span class="badge kind">☠</span>' +
      '<span class="hexname">' + S.boss.name + (S.boss.hitsLeft > 1 ? " · " + S.boss.hitsLeft + " lives" : "") + "</span>";

  } else {
    S.room.forEach((c, i) => {
      const b = document.createElement("button");
      b.className = "cardhex " + c.kind + (c.elite ? " elite" : "") + " enter" +
        (mode && mode.type === "smoke" && mode.picks.some((p) => cid(p) === cid(c)) ? " selected" : "");
      b.style.animationDelay = (i * 0.05) + "s";
      b.dataset.cid = cid(c);
      b.setAttribute("aria-label", cardName(c));

      const s = document.createElement("div");

  // hero row
  const wk = $("#weapon-kit");
  if (S.weapon) {
    wk.className = "kit";
    wk.innerHTML =
      '<span class="frame hexclip"><span class="fill hexclip"><span class="art">' + S.weapon.art + "</span></span></span>" +
      '<span class="badge small val">' + effPower() + "</span>" +
      '<span class="kitline">' + S.weapon.name.split(" ").pop() +
      (S.weaponLimit !== null ? ' <span class="limit">≤ ' + effLimit() + "</span>" : " · keen") + "</span>";
  } else {
    wk.className = "kit empty";
    wk.innerHTML = '<span class="frame slot"></span><span class="kitline">unarmed</span>';
  }
  $("#hp-num").textContent = S.hp + "/" + S.maxHp;
  const rk = $("#relic-kit");
  if (S.relics.length) {
    rk.className = "kit";
    rk.innerHTML =
      '<button class="frame hexclip" id="relic-open" aria-label="Relics"><span class="fill hexclip"><span class="art">' + RELICS[S.relics[S.relics.length - 1]].art + "</span></span></button>" +
      '<span class="badge small val">' + S.relics.length + "</span>" +
      '<span class="kitline">relics</span>';
    rk.querySelector("#relic-open").addEventListener("click", showRelicList);
  } else {
    rk.className = "kit empty";
    rk.innerHTML = '<span class="frame slot"></span><span class="kitline">no relics</span>';
  }

  $("#focus-pips").innerHTML = "◆".repeat(S.focus) + '<span class="off">' + "◆".repeat(Math.max(0, 2 - S.focus)) + "</span>";
  $("#gold-line").textContent = "🪙 " + S.gold;
  const bp = $("#bloodpact-btn");
  bp.hidden = !(hasRelic("bloodpact") && S.phase !== "over");
  bp.disabled = S.hp <= 2;

  // hand
  const hand = $("#handrow");
  hand.innerHTML = "";
  S.skills.hand.forEach((id, i) => {
    const sk = SKILLS[id];
    const locked = i === S.lockedIdx;
    const b = document.createElement("button");
    b.className = "skill" + (locked ? " locked" : "");
    b.disabled = locked || S.focus < sk.cost || S.phase === "over";
    b.dataset.skill = id;
    b.innerHTML =
      '<span class="s-art">' + (locked ? "⛓️" : sk.art) + "</span>" +
      '<span class="s-name">' + sk.name + "</span>" +
      '<span class="s-cost">' + (locked ? "locked" : sk.cost === 0 ? "free" : "◆".repeat(sk.cost)) + "</span>";

  const flee = document.createElement("button");

  flee.disabled = !canFleeNow() || mode !== null;
  flee.innerHTML = '<span class="f-art">🏃</span>FLEE';
  flee.addEventListener("click", doFlee);
  hand.appendChild(flee);

  $("#hint-line").textContent =
    S.phase !== "room" && S.phase !== "boss" ? "" :
    mode && mode.type === "smoke" ? (mode.picks.length === 2 ? "Tap Smoke Bomb again to finish." : "Choose " + (2 - mode.picks.length) + " card(s) to banish.") :
    mode ? "Choose a target… (tap the skill again to cancel)" :
    S.phase === "boss" ? "Tap the boss. Spend skills first if you need them." :
    S.fledLast && !hasRelic("boots") && !S.slipActive ? "You fled the last room — no escape from this one." :
    S.actedThisRoom > 0 ? "You have acted — see this room through." :
    "Face 3 of 4. The last card follows you down.";
}

/* ================================================================
   INTERACTION
   ================================================================ */
function floatText(text, tone) {
  const el = document.createElement("span");
  el.className = "float " + tone;
  el.textContent = text;
  $("#room").appendChild(el);
  el.addEventListener("animationend", () => el.remove());
}
function painFlash() { const p = $("#pain"); p.classList.remove("on"); void p.offsetWidth; p.classList.add("on"); }
function shakeScreen(big) { const a = $("#app"); a.classList.remove("shake", "shake-big"); void a.offsetWidth; a.classList.add(big ? "shake-big" : "shake"); }
function healPulse() { const h = $("#hero"); h.classList.remove("pulse"); void h.offsetWidth; h.classList.add("pulse"); }

function choreograph(el, fx) {
  if (el) el.classList.add(fx.hit ? "hit" : "resolve");
  if (fx.sound && SFX[fx.sound]) SFX[fx.sound]();
  if (fx.pain) { painFlash(); shakeScreen(fx.pain >= 8); buzz(fx.pain >= 8 ? 90 : 50); }
  if (fx.heal) { healPulse(); buzz(15); }
  floatText(fx.label, fx.tone);
  const room = $("#room");
  room.style.pointerEvents = "none";
  setTimeout(() => {
    room.style.pointerEvents = "";
    render();
    if (S.phase === "room" || S.phase === "boss") {
      if (S.hp === 0) endRun(false);
    }
  }, fx.hit || fx.heal ? 330 : 190);
}

function onRoomTap(c, el) {
  if (S.phase !== "room") return;
  if (mode) return handleTargetTap(c, el);
  openCardSheet(c);
}

/* ---------- card sheets ---------- */
function sheetOption(o) {

}
function sheetShell(titleHTML, noteText) {

  h.innerHTML = titleHTML;
  sheet.appendChild(h);
  if (noteText) {

}
function sheetCancel(sheet, label) {
  const c = document.createElement("button");
  c.className = "act cancel";
  c.innerHTML = '<span class="t">' + (label || "Leave it") + "</span>";
  c.addEventListener("click", closeSheet);
  sheet.appendChild(c);
  $("#backdrop").classList.add("open");

}
function closeSheet() { $("#sheet").classList.remove("open"); $("#backdrop").classList.remove("open"); }
$("#backdrop").addEventListener("click", closeSheet);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
function deathNote(dmg) { return dmg >= S.hp && !(hasRelic("phoenix") && !S.phoenixUsed) ? " — you will die" : ""; }

function fightOptionRows(c, sheet, resolveAfter) {
  const buffs = (S.strikeNext ? " · +“strike” " + S.strikeNext : "") + (S.gritNext ? " · grit +5" : "") + (S.block ? " · block " + S.block : "");
  if (S.weapon) {
    if (canUseWeapon(c)) {
      const pv = previewFight(c, true);
      sheet.appendChild(sheetOption({
        title: "Strike with the " + S.weapon.name + " (" + effPower() + ")",
        sub: (pv.dmg > 0 ? "take " + pv.dmg : "take no") + " damage" + buffs + " · dulls to ≤ " + (S.weapon.id === "hammer" ? c.r - 2 : c.r) + deathNote(pv.dmg),
        lethal: pv.dmg >= S.hp,
        onPick: () => {
          closeSheet();
          const el = $('[data-cid="' + cid(c) + '"]');
          const r = fightMonster(c, true);
          resolveAfter(c);
          choreograph(el, r.dmg > 0
            ? { label: "−" + r.dmg, tone: "blood", hit: true, pain: r.dmg, sound: "slash" }
            : { label: "blocked", tone: "steel", hit: true, sound: "slash" });
          if (r.outcome === "phoenix") setTimeout(() => { floatText("REBORN", "gold"); SFX.magic(); }, 380);
        },
      }));
    } else {
      sheet.appendChild(sheetOption({
        title: S.weapon.name + " is too dull",
        sub: "it only cuts monsters of threat " + effLimit() + " or less",
        disabled: true,
      }));
    }
  }
  const pvB = previewFight(c, false);
  sheet.appendChild(sheetOption({
    title: "Fight bare-handed",
    sub: (pvB.dmg > 0 ? "take " + pvB.dmg : "take no") + " damage" + buffs + deathNote(pvB.dmg),
    lethal: pvB.dmg >= S.hp,
    onPick: () => {
      closeSheet();
      const el = $('[data-cid="' + cid(c) + '"]');
      const r = fightMonster(c, false);
      resolveAfter(c);
      choreograph(el, { label: "−" + r.dmg, tone: "blood", hit: true, pain: r.dmg, sound: "thud" });
      if (r.outcome === "phoenix") setTimeout(() => { floatText("REBORN", "gold"); SFX.magic(); }, 380);
    },
  }));
}

function openCardSheet(c) {
  SFX.tap();
  const art = '<span class="h-art">' + cardArt(c) + "</span>";
  const std = (card) => { removeFromRoom(card); afterResolve(); };

  if (c.kind === "monster") {
    const sheet = sheetShell(art + cardName(c) + ' <span class="dim">— threat ' + threatOf(c) + "</span>",
      c.elite ? ELITES[c.elite].name + ": " + ELITES[c.elite].text + "." : null);
    fightOptionRows(c, sheet, std);
    sheetCancel(sheet);
  } else if (c.kind === "potion") {
    const sheet = sheetShell(art + cardName(c) + ' <span class="dim">— restores ' + c.r + "</span>");
    const allowed = !S.potionDrunk || S.secondPotion;
    const healed = allowed ? Math.min(S.maxHp - S.hp, c.r) : 0;
    sheet.appendChild(sheetOption({
      title: "Drink it",
      sub: !allowed ? "no effect — one potion per room"
         : healed === 0 ? "no effect — health is full"
         : "restore " + healed + " health" + (hasRelic("emberheart") ? " · Ember Heart seeks a victim" : ""),
      onPick: () => {
        closeSheet();
        let n = 0;
        if (allowed) {
          n = Math.min(S.maxHp - S.hp, c.r);
          S.hp += n;
          if (S.potionDrunk) S.secondPotion = false; else S.potionDrunk = true;
        }
        removeFromRoom(c);
        // Ember Heart: also slay the strongest monster with threat <= potion value
        let burned = null;
        if (hasRelic("emberheart")) {
          const targets = S.room.filter((m) => m.kind === "monster" && threatOf(m) <= c.r);
          if (targets.length) {
            burned = targets.reduce((a, b) => (threatOf(a) >= threatOf(b) ? a : b));
            removeFromRoom(burned);
            onSlain(burned);
          }
        }
        afterResolve();
        choreograph(null, { label: n > 0 ? "+" + n : "wasted", tone: "verd", heal: n > 0, sound: "heal" });
        if (burned) setTimeout(() => { floatText(cardArt(burned) + " burned", "gold"); SFX.magic(); }, 300);
      },
    }));
    sheetCancel(sheet);
  } else if (c.kind === "treasure") {
    const sheet = sheetShell(art + "Treasure <span class=\"dim\">— " + c.r + " gold</span>");
    sheet.appendChild(sheetOption({
      title: "Pocket it", goldact: true,
      sub: "+" + (hasRelic("glasssigil") ? c.r * 2 : c.r) + " gold",
      onPick: () => {
        closeSheet();
        goldGain(c.r);
        removeFromRoom(c); afterResolve();
        choreograph(null, { label: "+" + (hasRelic("glasssigil") ? c.r * 2 : c.r) + " 🪙", tone: "gold", sound: "coin" });
      },
    }));
    sheetCancel(sheet);
  } else if (c.kind === "cache") {
    const sheet = sheetShell(art + "Loot Cache <span class=\"dim\">— a skill waits inside</span>");
    sheet.appendChild(sheetOption({
      title: "Pry it open", goldact: true, sub: "draft 1 of 3 skill cards — or take gold instead",
      onPick: () => {
        removeFromRoom(c);
        showSkillDraft(() => { afterResolve(); render(); });
      },
    }));
    sheetCancel(sheet);
  } else { // curse
    const cu = CURSES[c.curse];
    const sheet = sheetShell('<span class="h-art">' + cu.art + "</span>" + cu.name + ' <span class="dim">— a curse</span>', cu.text);
    sheet.appendChild(sheetOption({
      title: "Suffer it", lethal: c.curse === "blight" && S.hp <= 3,
      sub: "curses cannot be ignored",
      onPick: () => {
        closeSheet();
        let fx = { label: "cursed", tone: "bone", sound: "curse" };
        if (c.curse === "blight") { const o = loseHp(3); fx = { label: "−3", tone: "blood", pain: 3, sound: "curse" }; if (o === "phoenix") setTimeout(() => floatText("REBORN", "gold"), 380); }
        if (c.curse === "thief") { S.gold = Math.max(0, S.gold - 5); fx = { label: "−5 🪙", tone: "gold", sound: "curse" }; }
        if (c.curse === "rust" && S.weapon) { S.weaponLimit = S.weaponLimit === null ? S.weapon.power : Math.min(S.weaponLimit, S.weapon.power); }
        removeFromRoom(c); afterResolve();
        choreograph($('[data-cid="' + cid(c) + '"]'), fx);
      },
    }));
    sheetCancel(sheet);
  }
}

function openBossSheet() {
  SFX.tap();
  const b = S.boss;
  const c = { kind: "monster", s: "♠", r: b.threat };
  const sheet = sheetShell('<span class="h-art">' + b.art + "</span>" + b.name + ' <span class="dim">— threat ' + b.threat + (b.hitsLeft > 1 ? " · two lives" : "") + "</span>", b.text);
  const mkPick = (useWeapon) => () => {
    closeSheet();
    const r = fightBoss(useWeapon);
    const el = $('[data-cid="boss"]');
    choreograph(el, r.dmg > 0
      ? { label: "−" + r.dmg, tone: "blood", hit: true, pain: r.dmg, sound: useWeapon ? "slash" : "thud" }
      : { label: "blocked", tone: "steel", hit: true, sound: useWeapon ? "slash" : "thud" });
    if (r.outcome === "phoenix") setTimeout(() => { floatText("REBORN", "gold"); SFX.magic(); }, 380);
    if (r.outcome === "slain") setTimeout(() => bossDefeated(), 700);
    if (r.outcome === "dead") setTimeout(() => endRun(false), 500);
  };
  const buffs = (S.strikeNext ? " · +strike " + S.strikeNext : "") + (S.gritNext ? " · grit" : "") + (S.block ? " · block " + S.block : "");
  if (S.weapon && canUseWeapon(c)) {
    const pv = previewFight(c, true);
    sheet.appendChild(sheetOption({
      title: "Strike with the " + S.weapon.name + " (" + effPower() + ")",
      sub: (pv.dmg > 0 ? "take " + pv.dmg : "take no") + " damage" + buffs + (b.special === "pierce" ? " · he shrugs off 3 power" : "") + deathNote(pv.dmg),
      lethal: pv.dmg >= S.hp, onPick: mkPick(true),
    }));
  } else if (S.weapon) {
    sheet.appendChild(sheetOption({ title: S.weapon.name + " is too dull", sub: "it only cuts threat " + effLimit() + " or less", disabled: true }));
  }
  const pvB = previewFight(c, false);
  sheet.appendChild(sheetOption({
    title: "Fight bare-handed",
    sub: (pvB.dmg > 0 ? "take " + pvB.dmg : "take no") + " damage" + buffs + deathNote(pvB.dmg),
    lethal: pvB.dmg >= S.hp, onPick: mkPick(false),
  }));
  sheetCancel(sheet, "Not yet");
}

/* ---------- skills ---------- */
function spendSkill(idx) {
  const id = S.skills.hand[idx];
  S.focus -= SKILLS[id].cost;
  S.skills.hand.splice(idx, 1);
  if (S.lockedIdx > idx) S.lockedIdx--;
  S.skills.disc.push(id);
}
function openSkillSheet(id, idx) {
  if (mode && mode.skillId === id) { mode = null; render(); return; }
  SFX.tap();
  const sk = SKILLS[id];
  const sheet = sheetShell('<span class="h-art">' + sk.art + "</span>" + sk.name + ' <span class="dim">— ' + (sk.cost === 0 ? "free" : sk.cost + " ◆") + "</span>", sk.text);
  const play = (after) => { spendSkill(idx); closeSheet(); after(); render(); };
  const needTargets = { bash: 1, revenant: 1, knifethrow: 1, snipe: 1, smokebomb: 1 };
  let usable = S.focus >= sk.cost;
  let why = "not enough focus";
  if (usable) {
    if (id === "knifethrow" && !S.weapon) { usable = false; why = "you carry no weapon"; }
    if ((id === "bash" || id === "revenant") && !S.room.some((c) => c.kind === "monster" && threatOf(c) <= (id === "bash" ? 6 : 8)) && S.phase === "room") { usable = false; why = "no valid target in the room"; }
    if (id === "smokebomb" && (S.deck.length < 2 || S.room.length < 2)) { usable = false; why = "needs 2 cards in deck and room"; }
    if (id === "necromancy" && S.discard.length === 0) { usable = false; why = "the discard is empty"; }
    if (id === "sharpen" && (!S.weapon || S.weaponLimit === null)) { usable = false; why = S.weapon ? "your blade is already keen" : "you carry no weapon"; }
    if (needTargets[id] && S.phase === "boss") { usable = false; why = "no use against the boss"; }
    if (id === "snipe" && S.room.length < 2) { usable = false; why = "nothing to banish"; }
  }
  sheet.appendChild(sheetOption({
    title: "Play " + sk.name,
    sub: usable ? sk.text : why,
    disabled: !usable,
    goldact: true,
    onPick: () => {
      if (id === "strike") play(() => { S.strikeNext += 3; floatText("+3 ⚔", "steel"); SFX.equip(); });
      else if (id === "guard") play(() => { S.block += 4; floatText("+4 🛡", "steel"); SFX.equip(); });
      else if (id === "grit") play(() => { S.gritNext += 5; floatText("grit", "steel"); SFX.equip(); });
      else if (id === "slip") play(() => { S.slipActive = true; S.fledLast = false; floatText("slip", "bone"); SFX.whoosh(); });
      else if (id === "mend") play(() => { const n = Math.min(S.maxHp - S.hp, 3); S.hp += n; floatText("+" + n, "verd"); SFX.heal(); healPulse(); });
      else if (id === "pickpocket") play(() => { goldGain(4); floatText("+" + (hasRelic("glasssigil") ? 8 : 4) + " 🪙", "gold"); SFX.coin(); });
      else if (id === "preserve") play(() => { S.preserveNext = true; floatText("preserved", "steel"); SFX.equip(); });
      else if (id === "sharpen") play(() => { S.weaponLimit = null; floatText("keen!", "steel"); SFX.equip(); });
      else if (id === "chalice") play(() => { S.secondPotion = true; floatText("chalice", "verd"); SFX.magic(); });
      else if (id === "scout") { spendSkill(idx); closeSheet(); showScout(); }
      else if (id === "necromancy") { spendSkill(idx); closeSheet(); showNecromancy(); }
      else { // targeting skills
        spendSkill(idx); closeSheet();
        mode = { type: id === "smokebomb" ? "smoke" : id === "knifethrow" ? "knife" : id, skillId: id, picks: [] };
        if (mode.type === "smoke") mode.drawn = S.deck.splice(0, 2);
        render();
      }
    },
  }));
  sheetCancel(sheet, "Keep it");
}
function handleTargetTap(c, el) {
  if (mode.type === "bash" || mode.type === "revenant") {
    const max = mode.type === "bash" ? 6 : 8;
    if (c.kind !== "monster" || threatOf(c) > max) { floatText("no", "bone"); return; }
    mode = null;
    removeFromRoom(c); onSlain(c); afterResolve();
    choreograph(el, { label: "slain", tone: "gold", hit: true, sound: "slash" });
  } else if (mode.type === "knife") {
    if (c.kind !== "monster") { floatText("no", "bone"); return; }
    mode = null;
    const dmg = Math.max(0, threatOf(c) - effPower() - S.gritNext + (c.elite === "armored" ? 2 : 0));
    const blocked = Math.min(S.block, dmg); S.block -= blocked;
    S.gritNext = 0;
    const o = loseHp(dmg - blocked);
    S.weapon = null; S.weaponLimit = null;
    onSlain(c);
    removeFromRoom(c); afterResolve();
    choreograph(el, { label: "−" + (dmg - blocked), tone: "blood", hit: true, pain: dmg - blocked, sound: "slash" });
    if (o === "phoenix") setTimeout(() => floatText("REBORN", "gold"), 380);
  } else if (mode.type === "snipe") {
    // open the normal action sheet for the target; if the player commits,
    // the afterResolve wrapper banishes the rest. Cancelling keeps Snipe armed.
    S.snipePending = true;
    openCardSheet(c);
  } else if (mode.type === "smoke") {
    const i = mode.picks.findIndex((p) => cid(p) === cid(c));
    if (i >= 0) mode.picks.splice(i, 1);
    else if (mode.picks.length < 2) mode.picks.push(c);
    if (mode.picks.length === 2) {
      mode.picks.forEach((pick, j) => {
        const idx = S.room.findIndex((x) => cid(x) === cid(pick));
        S.deck.push(S.room[idx]);
        S.room[idx] = mode.drawn[j];
      });
      mode = null;
      SFX.whoosh();
      floatText("swapped", "gold");
    }
    render();
  }
}
/* snipe banishing: hook into afterResolve via wrapper */
const _afterResolve = afterResolve;
afterResolve = function () {
  if (S.snipePending) {
    S.snipePending = false;
    mode = null;
    if (S.hp > 0) {
      S.deck.push(...S.room); // banish the rest of the room to the bottom
      S.room = [];
      if (S.deck.length > 0) dealRoom(false); else startBoss();
      return;
    }
  }
  _afterResolve();
};

function showNecromancy() {

  const sheet = sheetShell('<span class="h-art">🔮</span>Necromancy <span class="dim">— claim one red card</span>');
  let anyRed = false;
  six.forEach((c) => {

      sheet.appendChild(sheetOption({
        title: "Raise the " + cardName(c) + " (" + c.r + "♥)", goldact: true,
        sub: n > 0 ? "restore " + n + " health" : "no effect" + (allowed ? " — health is full" : " — one potion per room"),
        onPick: () => {

          closeSheet(); SFX.heal(); healPulse(); floatText(n > 0 ? "+" + n : "wasted", "verd"); render();
        },
      }));
    } else if (c.kind === "treasure" || c.kind === "cache") {

        title: "Raise the " + cardName(c) + " (♦)", goldact: true,

      }));

  if (!anyRed) sheet.appendChild(sheetOption({ title: "Only bones answered", sub: "nothing happens", disabled: true }));
  sheetCancel(sheet, anyRed ? "Take nothing" : "So be it");

}

}

function gainRelic(id) {

}
function showRelicList() {

function showShop(done) {
  const stockW = pickN(Object.keys(WEAPONS).filter((id) => id !== "dagger" && (!S.weapon || id !== S.weapon.id)), 2);
  const stockR = pickN(Object.keys(RELICS).filter((id) => !hasRelic(id)), 2);
  const stockS = pickN(DRAFT_POOL, 2);
  const removalPrice = () => 8 + S.removals * 4;
  const rebuild = () => {
    const sheet = sheetShell('<span class="h-art">🏪</span>The Between-Depths Shop <span class="dim">— 🪙 ' + S.gold + "</span>",
      "Spend before descending. Gold stays; regrets don't.");
    const row = (icon, name, sub, price, buy, soldOut) => {
      const b = document.createElement("button");
      b.className = "act" + (soldOut || price > S.gold ? "" : " goldact");
      b.disabled = soldOut || price > S.gold;
      b.innerHTML = '<span class="shoprow"><span class="s-icon">' + icon + '</span><span class="s-body"><span class="t">' + name + '</span><span class="sub">' + sub + '</span></span><span class="price">' + (soldOut ? "sold" : "🪙 " + price) + "</span></span>";
      if (!soldOut) b.addEventListener("click", () => { S.gold -= price; buy(); SFX.coin(); rebuild(); });
      sheet.appendChild(b);
    };
    stockW.forEach((id, i) => {
      const w = WEAPONS[id];
      row(w.art, w.name + " (" + w.power + ")", w.text, w.price, () => { S.weapon = Object.assign({ id }, w); S.weaponLimit = null; stockW[i] = null; }, stockW[i] === null);
    });
    stockR.forEach((id, i) => {
      const r = RELICS[id];
      row(r.art, r.name, r.text, r.price, () => { gainRelic(id); stockR[i] = null; }, stockR[i] === null);
    });
    stockS.forEach((id, i) => {
      const sk = SKILLS[id];
      row(sk.art, sk.name + " (skill)", sk.text, 5, () => { S.skills.disc.push(id); stockS[i] = null; }, stockS[i] === null);
    });
    row("🧉", "Tonic", "Heal 6 on the spot.", 6, () => { S.hp = Math.min(S.maxHp, S.hp + 6); });
    // removal charges only when a card is actually chosen inside showRemoval
    const rm = document.createElement("button");
    const rp = removalPrice();
    rm.className = "act" + (rp > S.gold ? "" : " goldact");
    rm.disabled = rp > S.gold;
    rm.innerHTML = '<span class="shoprow"><span class="s-icon">✂️</span><span class="s-body"><span class="t">Remove a skill card</span><span class="sub">Thin your deck — the fee rises each time.</span></span><span class="price">🪙 ' + rp + "</span></span>";
    rm.addEventListener("click", () => showRemoval(rp, () => rebuild()));
    sheet.appendChild(rm);
    const leave = document.createElement("button");
    leave.className = "act cancel";
    leave.innerHTML = '<span class="t">Descend to Depth ' + DEPTHS[Math.min(2, S.depth)].numeral + " →</span>";
    leave.addEventListener("click", () => { closeSheet(); done(); });
    sheet.appendChild(leave);
    $("#backdrop").classList.add("open");
    $("#sheet").classList.add("open");
    render();
  };
  rebuild();
}
function showRemoval(price, back) {
  const sheet = sheetShell('<span class="h-art">✂️</span>Remove a card <span class="dim">— it leaves the run</span>');
  const zones = [["draw", S.skills.draw], ["disc", S.skills.disc], ["hand", S.skills.hand]];
  const counts = {};
  zones.forEach(([z, arr]) => arr.forEach((id) => { counts[id] = (counts[id] || 0) + 1; }));
  Object.keys(counts).forEach((id) => {
    const sk = SKILLS[id];
    sheet.appendChild(sheetOption({
      title: sk.art + " " + sk.name + " ×" + counts[id], sub: sk.text, goldact: true,
      onPick: () => {
        for (const [, arr] of zones) {
          const i = arr.indexOf(id);
          if (i >= 0) { arr.splice(i, 1); break; }
        }
        S.gold -= price;
        S.removals++;
        SFX.coin();
        closeSheet(); back();
      },
    }));
  });
  sheetCancel(sheet, "Never mind");
}

$("#tut-next").addEventListener("click", () => {

  if (TUT[tutIdx].last) { closeTutorial(); startGame(randomSeed()); }
  else { tutIdx++; tutRender(); }
});

(function initStart() {
  const b = bestsGet();
  if (b.score !== null) $("#start-best").textContent = "best score " + b.score + " · depth " + (b.depth || 1);
  let taught = false;
  try { taught = localStorage.getItem("underdeck.taught") === "1"; } catch (e) {}
  if (!taught) openTutorial();
})();

/* ---------- ambient motes ---------- */
(function motes() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#motes"), cx = cv.getContext("2d");
  let w, h;
  function size() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
  size(); addEventListener("resize", size);
  const ps = Array.from({ length: 20 }, () => ({
    x: Math.random(), y: Math.random(), s: 0.5 + Math.random() * 1.4,
    v: 0.15 + Math.random() * 0.45, drift: Math.random() * 6.28,
  }));
  (function tick() {
    cx.clearRect(0, 0, w, h);
    cx.fillStyle = "rgba(217,164,65,1)";
    for (const p of ps) {
      p.y -= p.v / 1000; p.drift += 0.01;
      if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
      cx.globalAlpha = 0.05 + 0.16 * Math.sin(p.drift * 2) ** 2;
      cx.beginPath();
      cx.arc((p.x + Math.sin(p.drift) * 0.012) * w, p.y * h, p.s, 0, 7);
      cx.fill();
    }
    cx.globalAlpha = 1;
    requestAnimationFrame(tick);
  })();
})();

/* ================================================================
   Test hooks
   ================================================================ */
window.__ud = {
  start: (s) => startGame(s),
  state: () => S,
  render: () => render(),
  tutorial: { open: openTutorial, pages: () => TUT.length, index: () => tutIdx },
  fns: { canUseWeapon, previewFight, effPower, canFleeNow, hasRelic, gainRelic, scoreParts, buildDepthDeck },
};
